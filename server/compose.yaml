services:
  note:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-47821}:47821"
    environment:
      NOTE_TOKEN: ${NOTE_TOKEN:?set NOTE_TOKEN in server/.env}
      PORT: 47821
      NOTE_DB: /app/server/data/note.db
    volumes:
      - ./data:/app/server/data
    restart: unless-stopped
