name: check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun test

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, same as release
        with:
          toolchain: stable
          components: rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/files/src-tauri -> target
            apps/terminal/src-tauri -> target
            apps/installer/src-tauri -> target
            apps/cli -> target

      - run: bun run check:native
      - run: bun run test:native
      - name: Check Rust formatting
        shell: bash
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path apps/files/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path apps/terminal/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path packages/sync/p2p/Cargo.toml -- --check
          cargo fmt --manifest-path apps/installer/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path apps/cli/Cargo.toml -- --check
          cargo fmt --manifest-path packages/files/plugin/Cargo.toml -- --check
          cargo fmt --manifest-path packages/terminal/plugin/Cargo.toml -- --check
          cargo fmt --manifest-path packages/auth/plugin/Cargo.toml -- --check
          cargo fmt --manifest-path packages/window-kit/Cargo.toml -- --check
          cargo fmt --manifest-path packages/eris-style/Cargo.toml -- --check
          cargo fmt --manifest-path packages/is-screen-sharing/core/Cargo.toml -- --check

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, same as release
        with:
          toolchain: stable

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libssl-dev patchelf

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/installer/src-tauri -> target

      - run: cargo check --locked --manifest-path apps/installer/src-tauri/Cargo.toml
