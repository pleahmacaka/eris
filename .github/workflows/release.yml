name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      id: ${{ steps.target.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        if: github.event_name == 'push'

      - id: target
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || steps.release.outputs.tag_name }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == env.TAG) | .id')
          test -n "$id"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.id != ''
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: desktop, os: windows-latest, bundles: "" }
          - { app: files, os: windows-latest, bundles: "" }
          - { app: terminal, os: windows-latest, bundles: "" }
          - { app: files, os: ubuntu-latest, bundles: "--bundles appimage,deb" }
          - { app: terminal, os: ubuntu-latest, bundles: "--bundles appimage,deb" }
          - { app: files, os: macos-latest, bundles: "--bundles dmg" }
          - { app: terminal, os: macos-latest, bundles: "--bundles dmg" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libssl-dev patchelf

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.app }}-${{ matrix.os }}
          workspaces: './apps/${{ matrix.app }}/src-tauri -> target'
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.app == 'desktop' && runner.os == 'Windows' && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/${{ matrix.app }}
          releaseId: ${{ needs.version.outputs.id }}
          uploadUpdaterJson: ${{ matrix.app == 'desktop' }}
          args: ${{ matrix.bundles }}

  bundle:
    needs: [version, build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - run: choco install nsis --version=3.13.0 -y --no-progress

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist -p '*_x64-setup.exe'
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          cd installer
          "$makensis" -DVERSION="$TAG" -DDIST="$(cygpath -w ../dist)" -DOUTFILE="$(cygpath -w "../Eris_${TAG}_x64-installer.exe")" eris-setup.nsi
          cd ..
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "Eris_${TAG}_x64-installer.exe" --clobber

  publish:
    needs: [version, build, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.version.outputs.id }}
        run: gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true
