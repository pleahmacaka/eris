name: release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - run: bun run scripts/set-version.ts "$env:VERSION"

      - run: bun run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run scripts/set-version.ts "$VERSION"

      - run: bun run build

      - name: Pack web bundle
        run: |
          mkdir -p dist
          (cd build && zip -qr "../dist/Note-web-$VERSION.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: web
          if-no-files-found: error
          path: dist/*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Resolve NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          test -n "$ndk" || { echo "no ndk under $ANDROID_HOME/ndk"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - run: bun run scripts/set-version.ts "$VERSION"

      - run: bun run tauri android init --ci

      - run: bun run scripts/android-signing.ts

      - run: sed -n '1,60p' src-tauri/gen/android/app/build.gradle.kts

      - name: Write signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" || { echo "ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          store="$PWD/src-tauri/gen/android/release.p12"
          printf '%s' "$KEYSTORE" | base64 -d > "$store"
          cat > src-tauri/gen/android/keystore.properties <<PROPERTIES
          storeFile=$store
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          password=$KEYSTORE_PASSWORD
          PROPERTIES

      - run: bun run tauri android build --apk

      - name: Collect apk
        run: |
          mkdir -p dist
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" \
            -not -name "*unsigned*" | sort | head -1)
          test -n "$apk" || { echo "no signed release apk produced"; exit 1; }
          cp "$apk" "dist/Note-$VERSION.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: android
          if-no-files-found: error
          path: dist/*.apk

  publish:
    needs: [windows, web, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - run: find artifacts -type f

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Note ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.msi
            artifacts/web/*.zip
            artifacts/android/*.apk
