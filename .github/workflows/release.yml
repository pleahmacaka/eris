name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      id: ${{ steps.target.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: github.event_name == 'push'

      - id: target
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || steps.release.outputs.tag_name }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == env.TAG) | .id')
          test -n "$id"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  installer:
    needs: version
    if: needs.version.outputs.id != ''
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            apps: desktop files terminal
            bundle: nsis
            suffix: .exe
            installer: --no-bundle
            built: eris-installer.exe
            asset: windows_x64-installer.exe
          - os: ubuntu-22.04
            platform: linux-x86_64
            apps: files terminal
            bundle: appimage
            suffix: .AppImage
            installer: --bundles appimage
            built: bundle/appimage/*.AppImage
            asset: linux_x86_64-installer.AppImage
          - os: macos-latest
            platform: darwin-aarch64
            apps: files terminal
            bundle: app
            suffix: .app.tar.gz
            installer: --bundles dmg
            built: bundle/dmg/*.dmg
            asset: macos_aarch64-installer.dmg
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libssl-dev patchelf

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/files/src-tauri -> target
            apps/terminal/src-tauri -> target
            apps/installer/src-tauri -> target
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Build the apps into the installer payload
        shell: bash
        run: |
          payload=apps/installer/src-tauri/payload
          mkdir -p "$payload"

          for app in ${{ matrix.apps }}; do
            id=${app/desktop/eris}
            bundle="apps/$app/src-tauri/target/release/bundle"

            bun run --cwd "apps/$app" tauri build --bundles ${{ matrix.bundle }} \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'

            case "${{ matrix.bundle }}" in
              nsis) cp "$bundle"/nsis/*-setup.exe "$payload/$id.exe" ;;
              appimage) cp "$bundle"/appimage/*.AppImage "$payload/$id.AppImage" ;;
              app)
                bundled=$(find "$bundle/macos" -maxdepth 1 -name "*.app" | head -1)
                tar -czf "$payload/$id.app.tar.gz" -C "$(dirname "$bundled")" "$(basename "$bundled")"
                ;;
            esac

            test -s "$payload/$id${{ matrix.suffix }}"
          done

          ls -la "$payload"

      - run: bun run --cwd apps/installer tauri build ${{ matrix.installer }}

      - name: Sign and upload the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="Eris_${TAG}_${{ matrix.asset }}"

          cp apps/installer/src-tauri/target/release/${{ matrix.built }} "$installer"
          bun run --cwd apps/installer tauri signer sign "$PWD/$installer"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$installer" --clobber

          mkdir -p signature
          jq -n --arg name "$installer" --arg signature "$(cat "$installer.sig")" \
            '{name: $name, signature: $signature}' > "signature/${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature-${{ matrix.platform }}
          path: signature/*
          if-no-files-found: error

  cli:
    needs: version
    if: needs.version.outputs.id != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli
          workspaces: './apps/cli -> target'
          cache-on-failure: true

      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cargo-deb --locked

      - working-directory: apps/cli
        env:
          ERIS_VERSION: ${{ needs.version.outputs.tag }}
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cargo deb --target x86_64-unknown-linux-musl --no-build --deb-version "$ERIS_VERSION"

      - env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" apps/cli/target/x86_64-unknown-linux-musl/debian/*.deb --clobber

  android:
    needs: version
    if: needs.version.outputs.id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Resolve NDK
        run: |
          ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)
          test -n "$ndk" || { echo "no ndk under $ANDROID_HOME/ndk"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
          workspaces: './apps/files/src-tauri -> target'
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - name: Write signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" || { echo "ANDROID_KEYSTORE_BASE64 is empty"; exit 1; }
          android=apps/files/src-tauri/gen/android
          store="$PWD/$android/release.p12"
          printf '%s' "$KEYSTORE" | base64 --decode > "$store"
          cat > "$android/keystore.properties" <<PROPERTIES
          storeFile=$store
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          password=$KEYSTORE_PASSWORD
          PROPERTIES

      - run: bun run --cwd apps/files tauri android build --apk

      - env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find apps/files/src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" -not -name "*unsigned*" | sort | head -1)
          test -n "$apk" || { echo "no signed release apk produced"; exit 1; }
          cp "$apk" "Eris.Files_${TAG}.apk"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "Eris.Files_${TAG}.apk" --clobber

  manifest:
    needs: [version, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signature-*
          path: signature
          merge-multiple: true

      # every installed Eris updates through windows-x86_64*, so those keys must keep pointing at the signed Windows installer
      - env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --arg version "$TAG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[inputs | {
                key: (input_filename | ltrimstr("signature/") | rtrimstr(".json")),
                value: {url: ($base + "/" + .name), signature: .signature}
              }]
              | from_entries
              | (.["windows-x86_64"] // error("the Windows installer was not built")) as $windows
              | {
                  version: $version,
                  notes: "",
                  pub_date: $date,
                  platforms: (with_entries(.key |= "eris-installer-" + .) + {
                    "windows-x86_64": $windows,
                    "windows-x86_64-nsis": $windows,
                    "windows-x86_64-msi": $windows
                  })
                }' signature/*.json > latest.json

          cat latest.json
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" latest.json --clobber

  publish:
    needs: [version, manifest, cli, android]
    if: always() && needs.manifest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.version.outputs.id }}
        run: gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true
