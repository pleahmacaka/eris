name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.event.inputs.tag || steps.release.outputs.tag_name }}
      build: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name == 'push'

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: ${{ needs.version.outputs.tag }}
