[package]
name = "eris-style"
version = "0.1.0"
description = "Eris look sync for standalone Eris family apps"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.11"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
winreg = "0.55"
