[package]
name = "tauri-plugin-eris-terminal"
version = "0.1.0"
description = "Pseudo console sessions for Eris family apps"
edition = "2021"
rust-version = "1.91"
links = "tauri-plugin-eris-terminal"

[dependencies]
eris-window-kit = { version = "0.1.0", path = "../../window-kit" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
tauri = "2.12"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Registry"] }
winreg = "0.56"
