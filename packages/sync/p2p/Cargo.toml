[package]
name = "eris-p2p"
version = "0.1.0"
description = "Peer-to-peer snapshot exchange shared by Eris and Note"
edition = "2021"
rust-version = "1.91"

[dependencies]
data-encoding = "2.11.1"
iroh = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[features]
default = ["tauri"]
tauri = ["dep:tauri"]
