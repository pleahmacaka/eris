[package]
name = "eris-window-kit"
version = "0.1.0"
description = "Child window helpers shared by Eris family plugins"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
tauri = "2.12"
tauri-plugin-opener = "2.7"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
