[package]
name = "tauri-plugin-eris-files"
version = "0.1.0"
description = "File explorer backend for Eris family apps"
edition = "2021"
rust-version = "1.95"
links = "tauri-plugin-eris-files"

[dependencies]
chrono = "0.4.45"
data-encoding = "2"
eris-window-kit = { version = "0.1.0", path = "../../window-kit" }
image = { version = "0.25.6", default-features = false, features = ["png"] }
iroh = "1.3"
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
is-screen-sharing = { version = "0.1.0", path = "../../is-screen-sharing/core" }
n0-future = "0.3"
percent-encoding = "2.3.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", features = ["all"] }
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tokio = { version = "1", features = ["sync", "time"] }
unarc-rs = { version = "0.7", default-features = false }
uuid = { version = "1", features = ["serde", "v4"] }
wildmatch = "2.6.1"

[target."cfg(windows)".dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "multipart", "json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Environment", "Win32_Storage_EnhancedStorage", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_NetworkManagement_WNet", "Win32_Security_Credentials", "Win32_Graphics_Dwm"] }
winreg = "0.55"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
