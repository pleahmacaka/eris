[package]
name = "arixlab-note"
version = "0.1.0"
description = "Note"
edition = "2021"
rust-version = "1.91"

[lib]
name = "note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-os = "2"
iroh = "1.2.0"
data-encoding = "2.11.1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-fs = { version = "2.6.0", features = ["watch"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-persisted-scope = "2.4.0"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-deep-link = "2.5.0"
tauri-plugin-opener = "2.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }
