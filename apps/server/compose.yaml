services:
  eris:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    ports:
      - "${PORT:-8787}:8787"
    environment:
      ERIS_TOKEN: ${ERIS_TOKEN:?set ERIS_TOKEN in apps/server/.env}
      PORT: 8787
      ERIS_DB: /app/apps/server/data/eris.db
    volumes:
      - ./data:/app/apps/server/data
    restart: unless-stopped
