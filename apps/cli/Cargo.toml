[package]
name = "eris-cli"
version = "0.3.12"
edition = "2024"
description = "Eris command line and headless sync server"
repository = "https://github.com/pleahmacaka/eris"

[[bin]]
name = "eris"
path = "src/main.rs"

[package.metadata.deb]
name = "eris-cli"
maintainer = "PleahMaCaka <pleahmacaka@gmail.com>"
section = "net"
depends = ""
extended-description = "eris sync up starts a headless Eris sync server and prints the sync code."
assets = [
  ["target/release/eris", "usr/bin/", "755"],
  ["eris-sync.service", "usr/lib/systemd/user/", "644"],
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eris-p2p = { version = "0.1.0", path = "../../packages/sync/p2p", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
