[package]
name = "eris-installer"
version = "0.1.0"
description = "Eris installer"
edition = "2021"
rust-version = "1.91"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tempfile = "3.27.0"

[build-dependencies]
serde_json = "1.0.154"
tauri-build = { version = "2", features = [] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Environment"] }
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1.1.10"
plist = "1.10.1"
tar = "0.4.46"
